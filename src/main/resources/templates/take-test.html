<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${test.name} + ' - Elementary Math Recap'">Take Test</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/nav.css}">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>📐 Saxon Math</h2>
            </div>
            <ul class="nav-links">
                <li><a th:href="@{/lessons}">🎓 Lessons</a></li>
                <li><a th:href="@{/quiz}">✏️ Practice Test</a></li>
                <li class="active"><a th:href="@{/tests}">📝 Tests</a></li>
                <li><a th:href="@{/badges}">🏆 Badges</a></li>
                <li><a th:href="@{/olympiad}">🏅 Olympiad</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <a th:href="@{/tests}" class="back-link">← Back to Tests</a>
                <div class="profile-section" th:if="${currentUser}">
                    <span class="avatar" th:if="${currentUser.avatarType == 'emoji'}" th:text="${currentUser.avatar}"></span>
                    <img th:if="${currentUser.avatarType == 'image'}" th:src="${currentUser.avatar}" class="avatar-img" alt="Avatar">
                    <span class="display-name" th:text="${currentUser.displayName}"></span>
                    <a th:href="@{/logout}" class="sign-out">Sign Out</a>
                </div>
            </header>

            <div class="test-take-container">
                <div class="test-info-header">
                    <h1 th:text="${test.name}"></h1>
                    <div class="test-meta">
                        <span class="page-indicator" th:text="'Page ' + (${currentPage} + 1) + ' of ' + ${totalPages}"></span>
                        <span class="question-count" th:text="${totalQuestions} + ' questions total'"></span>
                    </div>
                </div>

                <form th:action="@{/tests/{id}/save-answers(id=${test.id})}" method="post" id="testForm">
                    <div th:each="question, iterStat : ${questions}" class="question-card test-question" th:data-page="${iterStat.index / 5}">
                        <div class="question-header">
                            <span class="question-num" th:text="'Question ' + (${iterStat.index} + 1)"></span>
                        </div>
                        <p class="question-text" th:text="${question.questionText}"></p>
                        <div th:if="${question.illustration}" class="question-illustration" th:utext="${question.illustration}"></div>

                        <div class="radio-choices">
                            <label class="radio-choice">
                                <input type="radio" th:name="'answer_' + ${question.id}" value="A">
                                <span class="radio-label"><strong>A.</strong> <span th:text="${question.optionA}"></span></span>
                            </label>
                            <label class="radio-choice">
                                <input type="radio" th:name="'answer_' + ${question.id}" value="B">
                                <span class="radio-label"><strong>B.</strong> <span th:text="${question.optionB}"></span></span>
                            </label>
                            <label class="radio-choice">
                                <input type="radio" th:name="'answer_' + ${question.id}" value="C">
                                <span class="radio-label"><strong>C.</strong> <span th:text="${question.optionC}"></span></span>
                            </label>
                            <label class="radio-choice">
                                <input type="radio" th:name="'answer_' + ${question.id}" value="D">
                                <span class="radio-label"><strong>D.</strong> <span th:text="${question.optionD}"></span></span>
                            </label>
                        </div>
                    </div>

                    <!-- Navigation -->
                    <div class="test-navigation">
                        <button type="button" id="prevBtn" class="page-btn" onclick="changePage(-1)">← Previous</button>
                        <span id="pageIndicator" class="page-indicator"></span>
                        <button type="button" id="nextBtn" class="page-btn" onclick="changePage(1)">Next →</button>
                        <button type="submit" id="submitBtn" class="btn btn-primary submit-test-btn" style="display:none">Submit Test</button>
                    </div>

                    <!-- Page number links -->
                    <div class="page-numbers" id="pageNumbers"></div>
                </form>
            </div>
        </main>
    </div>
    <script>
        var currentPage = 0;
        var totalPages = Math.ceil(document.querySelectorAll('.test-question').length / 5);

        function showPage(page) {
            document.querySelectorAll('.test-question').forEach(function(q) {
                q.style.display = (parseInt(q.dataset.page) === page) ? 'block' : 'none';
            });
            currentPage = page;
            document.getElementById('pageIndicator').textContent = 'Page ' + (page+1) + ' of ' + totalPages;
            document.getElementById('prevBtn').style.display = page > 0 ? 'inline-block' : 'none';
            document.getElementById('nextBtn').style.display = page < totalPages-1 ? 'inline-block' : 'none';
            document.getElementById('submitBtn').style.display = page === totalPages-1 ? 'inline-block' : 'none';
            // Update page numbers
            var pn = document.getElementById('pageNumbers');
            pn.innerHTML = '';
            for (var i = 0; i < totalPages; i++) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = i + 1;
                btn.className = 'page-num' + (i === page ? ' active' : '');
                btn.onclick = (function(p) { return function() { showPage(p); }; })(i);
                pn.appendChild(btn);
            }
        }

        function changePage(dir) { showPage(currentPage + dir); }

        // Shuffle answer choices
        document.querySelectorAll('.radio-choices').forEach(function(container) {
            var choices = Array.from(container.children);
            for (var i = choices.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                container.appendChild(choices[j]);
            }
        });

        // Init
        showPage(0);
    </script>
</body>
</html>
