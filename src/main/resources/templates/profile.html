<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Elementary Math Recap</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/nav.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar">
            <div class="sidebar-header"><h2>📐 Saxon Math</h2></div>
            <ul class="nav-links">
                <li><a th:href="@{/lessons}">🎓 Lessons</a></li>
                <li><a th:href="@{/quiz}">✏️ Practice Test</a></li>
                <li><a th:href="@{/tests}">📝 Tests</a></li>
                <li><a th:href="@{/badges}">🏆 Badges</a></li>
            </ul>
        </nav>
        <main class="main-content">
            <header class="top-bar">
                <h1>👤 My Profile</h1>
                <div class="profile-section" th:if="${currentUser}">
                    <span class="avatar" th:if="${currentUser.avatarType == 'emoji'}" th:text="${currentUser.avatar}"></span>
                    <img th:if="${currentUser.avatarType == 'image'}" th:src="${currentUser.avatar}" class="avatar-img" alt="Avatar">
                    <span class="display-name" th:text="${currentUser.displayName}"></span>
                    <a th:href="@{/logout}" class="sign-out">Sign Out</a>
                </div>
            </header>
            <div class="profile-card" th:if="${currentUser}">
                <div class="current-avatar">
                    <span th:if="${currentUser.avatarType == 'emoji'}" class="big-avatar" th:text="${currentUser.avatar}"></span>
                    <img th:if="${currentUser.avatarType == 'image'}" th:src="${currentUser.avatar}" class="big-avatar-img" alt="Avatar">
                    <h2 th:text="${currentUser.displayName}"></h2>
                    <p th:text="'@' + ${currentUser.username}"></p>
                </div>
                <form th:action="@{/profile/avatar}" method="post" class="avatar-form">
                    <h3>Change Your Emoji</h3>
                    <div class="emoji-grid">
                        <button type="submit" name="avatar" value="😊" class="emoji-btn">😊</button>
                        <button type="submit" name="avatar" value="😎" class="emoji-btn">😎</button>
                        <button type="submit" name="avatar" value="🤓" class="emoji-btn">🤓</button>
                        <button type="submit" name="avatar" value="🦊" class="emoji-btn">🦊</button>
                        <button type="submit" name="avatar" value="🐱" class="emoji-btn">🐱</button>
                        <button type="submit" name="avatar" value="🐶" class="emoji-btn">🐶</button>
                        <button type="submit" name="avatar" value="🦄" class="emoji-btn">🦄</button>
                        <button type="submit" name="avatar" value="🐼" class="emoji-btn">🐼</button>
                        <button type="submit" name="avatar" value="🌟" class="emoji-btn">🌟</button>
                        <button type="submit" name="avatar" value="🚀" class="emoji-btn">🚀</button>
                        <button type="submit" name="avatar" value="🎨" class="emoji-btn">🎨</button>
                        <button type="submit" name="avatar" value="⚡" class="emoji-btn">⚡</button>
                    </div>
                    <input type="hidden" name="avatarType" value="emoji">
                </form>
            </div>
        </main>
    </div>
</body>
</html>
